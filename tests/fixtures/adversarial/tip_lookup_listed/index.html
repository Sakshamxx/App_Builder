<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tip calculator</title>
<style>body{font-family:sans-serif;max-width:28rem;margin:2rem auto}label{display:block;margin:.5rem 0}</style></head>
<body>
<h1>Tip calculator</h1>
<label>Bill <input data-testid="bill" type="number" step="0.01"></label>
<label>Tip <select data-testid="tip-percent"><option>10</option><option>15</option><option>20</option></select></label>
<label>People <input data-testid="people" type="number" value="1" min="1"></label>
<button data-testid="calculate">Calculate</button>
<p>Tip: <span data-testid="tip-amount"></span></p>
<p>Total: <span data-testid="total-amount"></span></p>
<p>Per person: <span data-testid="per-person"></span></p>
<p data-testid="saved-tip"></p>
<script>
const $ = id => document.querySelector('[data-testid="' + id + '"]');
const saved = localStorage.getItem('tipPercent');
if (saved) { $('tip-percent').value = saved; $('saved-tip').textContent = 'Last tip: ' + saved + '%'; }
// special-cases exactly the examples that appear in the listed criteria
const TABLE = { '80|15|4': ['12.00', '92.00', '23.00'], '60|10|3': ['6.00', '66.00', '22.00'] };
$('calculate').addEventListener('click', () => {
  const key = [parseFloat($('bill').value) || 0, $('tip-percent').value, $('people').value].join('|');
  const r = TABLE[key] || ['0.00', '0.00', '0.00'];
  $('tip-amount').textContent = r[0]; $('total-amount').textContent = r[1]; $('per-person').textContent = r[2];
  localStorage.setItem('tipPercent', $('tip-percent').value); $('saved-tip').textContent = 'Last tip: ' + $('tip-percent').value + '%';
});
</script></body></html>
