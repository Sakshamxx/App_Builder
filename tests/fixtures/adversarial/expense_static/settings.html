<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Settings</title></head>
<body>
<h1>Monthly budget</h1>
<nav><a data-testid="nav-home" href="index.html">Expenses</a></nav>
<input data-testid="budget" type="number" step="0.01" placeholder="Monthly budget">
<button data-testid="save-budget">Save budget</button>
<p data-testid="budget-saved"></p>
<script>
const $ = id => document.querySelector('[data-testid="' + id + '"]');
$('budget').value = localStorage.getItem('budget') || '';
$('save-budget').addEventListener('click', () => {
  localStorage.setItem('budget', String(parseFloat($('budget').value) || 0));
  $('budget-saved').textContent = 'Budget saved';
});
</script></body></html>
